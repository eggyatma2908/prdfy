version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai-prd-generator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-prd_generator}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-prd-generator-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "5555:5555"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@db:5432/${DB_NAME:-prd_generator}?schema=public
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:
